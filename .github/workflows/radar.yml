name: MetsaRadar Gölge İşçi

on:
  schedule:
    - cron: '0 */12 * * *' # Her 12 saatte bir otomatik çalışır (Günde 2 kez)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Node.js'i Kur
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Botu Ateşle
        env:
          LWATLAS_API_KEY: ${{ secrets.LWATLAS_API_KEY }}
        run: node bot.js
